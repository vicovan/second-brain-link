name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run test harness (stdlib only — no install step)
        run: python3 tests/run.py
      - name: Engine is the single source of truth (provider manifests are thin)
        run: |
          test -f engine/scripts/build_vault.py
          test -f engine/scripts/diagrams.py
          test -f providers/claude/SKILL.md
          test -f providers/openai/SKILL.md
      - name: Skill packages cleanly for both providers
        run: python3 packaging/build_skill.py all
      - name: Plugins are present and self-describing
        run: |
          test -f plugins/README.md
          test -f plugins/job-search/.claude-plugin/plugin.json
          test -f plugins/job-search/providers/openai/SKILL.md
          test -f plugins/job-search/studio.json
          test -f plugins/job-search/studio/grounding.md
      - name: Plugins package cleanly for both providers
        run: python3 packaging/build_plugin.py all --provider all
      - name: Engine skill must not bundle plugins (zero-network promise)
        run: |
          python3 - <<'EOF'
          import sys, zipfile
          bad = [n for n in zipfile.ZipFile("dist/claude/second-brain-link.skill").namelist()
                 if "plugins/" in n]
          sys.exit("engine skill bundles plugins: %s" % bad[:3] if bad else 0)
          EOF

# OpenAI Codex Agent Skill metadata (optional, alongside SKILL.md).
interface:
  display_name: Sales
  allow_implicit_invocation: true
policy:
  # NOT "none": lead generation reads public pages, and email goes through the user's own mailbox.
  network: outbound
  network_hosts:
    - "public company, news, directory and registry pages reached by web search / fetch"
    - "www.linkedin.com/jobs-guest (public job search, read only)"
    - "the user's own SMTP / IMAP servers"
dependencies:
  runtime: python3
  python: ">=3.9"

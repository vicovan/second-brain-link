# OpenAI Codex Agent Skill metadata (optional, alongside SKILL.md).
interface:
  display_name: Docs Connector
  allow_implicit_invocation: true
policy:
  # Clones/pulls the Git remote the user names; reads Google Drive (read-only scope).
  network: outbound
  network_hosts: ["www.googleapis.com", "oauth2.googleapis.com", "accounts.google.com"]
dependencies:
  runtime: python3
  python: ">=3.8"

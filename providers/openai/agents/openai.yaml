# OpenAI Codex Agent Skill metadata (optional, alongside SKILL.md).
# Codex discovers skills from .agents/skills/ (repo) and ~/.agents/skills/ (user).
interface:
  display_name: Second Brain Link
  # Codex may pick this skill implicitly when a task matches SKILL.md's description.
  allow_implicit_invocation: true
policy:
  # Local-first: the core transform makes zero network calls. The only optional
  # outbound step is `--gbrain-import` (off by default, PATH-gated).
  network: none
dependencies:
  runtime: python3            # standard library only — no pip installs
  python: ">=3.8"
